[package]
name = "larp"
version = "0.3.0"
edition = "2021"
description = "Agent memory file format: compact, versioned, searchable memory in a single file"
license = "MIT"

[lib]
name = "larp"
path = "src/lib.rs"

[[bin]]
name = "larp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"

[profile.release]
opt-level = 3
