[package]
name = "larp-memory"
  version = "1.4.0"
edition = "2021"
description = "Agent memory file format: compact, versioned, searchable memory in a single file"
license = "MIT"
repository = "https://github.com/pal404error/larp-files"
readme = "README.md"
keywords = ["ai", "agents", "memory", "file-format", "mcp"]
categories = ["command-line-utilities", "data-structures"]

[lib]
name = "larp_memory"
path = "src/lib.rs"

[[bin]]
name = "larp"
path = "src/main.rs"

[dependencies]
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.14"
# v1.4 semantic recall: ONNX Runtime + HF tokenizers for the
# lazily-downloaded Xenova all-MiniLM-L6-v2 model, ureq for the
# one-time model download.
# NOTE: ort 1.x is entirely yanked on crates.io (1.13-1.16 yanked),
# so v1.4 pins the ort 2.0 release candidate explicitly; move to
# `ort = "2"` when 2.0 stable ships.
ort = { version = "=2.0.0-rc.15", features = ["download-binaries", "copy-dylibs"] }
tokenizers = "0.22"
ureq = "2"

# Windows-only: load ONNX Runtime dynamically at runtime instead of
# linking it. The GitHub runner image ships an older onnxruntime.dll
# (1.17.1, API 17 only) that wins the DLL search over our 1.31.0 in
# the test jobs — even with the 1.31.0 DLLs staged next to the test
# binaries — so ort dlopens the exact 1.31.0 file via ORT_DYLIB_PATH
# (set in CI) instead of relying on the search order. End users are
# unaffected: without ORT_DYLIB_PATH, ort dlopens "onnxruntime.dll"
# and the exe directory (where install.ps1 puts the DLLs) is
# searched first.
[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.15", features = ["download-binaries", "copy-dylibs", "load-dynamic"] }

[profile.release]
opt-level = 3
