[package]
name = "larp-memory"
version = "1.0.0"
edition = "2021"
description = "Agent memory file format: compact, versioned, searchable memory in a single file"
license = "MIT"
repository = "https://github.com/pal404error/larp-files"
readme = "README.md"
keywords = ["ai", "agents", "memory", "file-format", "mcp"]
categories = ["command-line-utilities", "data-structures"]

[lib]
name = "larp_memory"
path = "src/lib.rs"

[[bin]]
name = "larp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.14"

[profile.release]
opt-level = 3
