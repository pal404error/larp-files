name: Tests

# Maximum test coverage for the larp crate:
#  - unit + integration + doc tests on every OS x toolchain (debug)
#  - the same suite in release mode (Linux, stable)
#  - examples + a CLI/MCP smoke run against the release binary
#  - clippy, rustfmt, and docs, all warning-free
#  - a nightly full-matrix run so regressions surface even without a PR
#
# Notes:
#  - `cargo test --locked` pins the exact Cargo.lock, so CI tests the
#    same dependency set that ships.
#  - The `ort` dependency downloads prebuilt ONNX Runtime binaries from
#    pyke.io at build time (network required on the runner). If that CDN
#    is unreachable, a local build can point at an existing ONNX Runtime
#    install instead: ORT_LIB_LOCATION=<dir with libonnxruntime.so>
#    ORT_PREFER_DYNAMIC_LINK=1 LD_LIBRARY_PATH=<same dir>.
#  - The v1.4 semantic tests download the Xenova all-MiniLM-L6-v2 model
#    (~90 MB) into ~/.cache/larp/models on first use; that dir is cached
#    across runs so repeat jobs do not re-download it.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full-matrix run at 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, beta]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Cache the embedding model (v1.4 semantic tests)
        uses: actions/cache@v4
        with:
          path: ~/.cache/larp/models
          key: larp-model-${{ runner.os }}-minilm-l6-v2
      # Windows cannot use ort's prebuilt static library: it is built
      # with /MD while tokenizers' esaxx is forced /MT by its own build
      # script, so the static link fails with LNK2005/LNK4098 one way
      # and LNK2038 the other. Link ONNX Runtime dynamically instead,
      # from Microsoft's official 1.31.0 NuGet package (the same
      # runtime version pyke ships for Linux/macOS). The copy-dylibs
      # ort feature puts the DLLs next to the built binary in
      # target/debug (or target/release), which covers the release
      # smoke test; the test job copies them explicitly (below)
      # because the test binaries live elsewhere.
      - name: Fetch ONNX Runtime 1.31.0 (Windows, dynamic link)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "$env:RUNNER_TEMP\ort.nupkg"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/1.31.0/microsoft.ml.onnxruntime.1.31.0.nupkg" -OutFile $zip
          $dir = "$env:RUNNER_TEMP\onnxruntime"
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $lib = Join-Path $dir "runtimes\win-x64\native"
          "ORT_LIB_LOCATION=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ORT_PREFER_DYNAMIC_LINK=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ORT_NATIVE_DIR=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Test binaries run from target/debug/deps, where copy-dylibs
          # does not place the DLLs (it stops at target/debug when it
          # has to copy instead of symlink); put the native dir on
          # PATH so every built binary can load onnxruntime.dll.
          $lib | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      # lib + integration + doc tests, every target, debug profile.
      # Windows: the runner image ships an older onnxruntime.dll
      # (1.17.1, API 17 only) that would otherwise win the DLL
      # search over our 1.31.0 and fail ort::init() with
      # "requested API version [31]". The exe directory is searched
      # first, so build the test binaries, copy the 1.31.0 DLLs
      # next to every built exe — cargo reports them under
      # target/debug/build/<pkg>/out on this runner, not deps/,
      # so target\debug\deps does not even exist after --no-run —
      # then run the tests.
      - if: runner.os == 'Windows'
        run: cargo test --locked --all-targets --no-run
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem target\debug -Recurse -Include *.exe -File |
            Select-Object -ExpandProperty DirectoryName -Unique |
            ForEach-Object { Copy-Item "$env:ORT_NATIVE_DIR\*.dll" -Destination $_ -Force }
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc
      # The ignored-tests list must stay empty: a test that is ignored
      # is a gap, not a pass. Fails the job if anything is #[ignore]d.
      - name: Fail if any test is ignored
        shell: bash
        run: |
          if grep -rn '#\[ignore' src tests examples 2>/dev/null; then
            echo "::error:: ignored test(s) found above — un-ignore them or delete them"
            exit 1
          fi
          echo "no ignored tests"

  test-release:
    name: test --release (ubuntu, stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache the embedding model (v1.4 semantic tests)
        uses: actions/cache@v4
        with:
          path: ~/.cache/larp/models
          key: larp-model-Linux-minilm-l6-v2
      - run: cargo test --locked --release --all-targets
      - run: cargo test --locked --release --doc

  examples-and-smoke:
    name: examples + CLI/MCP smoke (ubuntu, stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache the embedding model (v1.4 semantic tests)
        uses: actions/cache@v4
        with:
          path: ~/.cache/larp/models
          key: larp-model-Linux-minilm-l6-v2
      - name: Run the library quickstart example
        run: cargo run --locked --example quickstart
      - name: Build the release binary
        run: cargo build --locked --release
      - name: CLI smoke test (init/append/search/recall/verify/stats)
        shell: bash
        run: |
          set -euo pipefail
          LARP=target/release/larp
          TMP=$(mktemp -d)
          cd "$TMP"
          "$OLDPWD/$LARP" --file smoke.larp init
          "$OLDPWD/$LARP" --file smoke.larp append --type fact --salience 0.9 "the user prefers rust for backend work"
          "$OLDPWD/$LARP" --file smoke.larp append --type preference "likes short answers"
          "$OLDPWD/$LARP" --file smoke.larp search rust | grep -q "prefers rust"
          "$OLDPWD/$LARP" --file smoke.larp recall --max-tokens 500 rust | grep -q "tokens used"
          "$OLDPWD/$LARP" --file smoke.larp verify
          "$OLDPWD/$LARP" --file smoke.larp stats | grep -q "live_records: 2"
          "$OLDPWD/$LARP" --version
          echo "CLI smoke test passed"
      - name: MCP smoke test (stdlib Python client)
        shell: bash
        run: |
          export PATH="$PWD/target/release:$PATH"
          python3 examples/larp_mcp_client.py

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo fmt --check
      - name: Docs build warning-free
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps
      - run: cargo install --locked cargo-audit
      - run: cargo audit
