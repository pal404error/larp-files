name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Least privilege by default. Only the single publish job can write, and
# the build jobs (which run the toolchain action) hold a read-only token.
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Stage per-OS artifacts (Linux/macOS binaries share a name)
        shell: bash
        env:
          OS_NAME: ${{ runner.os }}
        run: |
          mkdir dist
          if [ -f target/release/larp.exe ]; then
            cp target/release/larp.exe "dist/larp-${OS_NAME}.exe"
          else
            cp target/release/larp "dist/larp-${OS_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: larp-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
      id-token: write # sign build provenance via Sigstore
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS (verified by install.sh / install.ps1)
        working-directory: dist
        run: |
          sha256sum larp-* > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance (verify with `gh attestation verify`)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/larp-*
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/larp-*
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
