name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Least privilege by default. Only the single publish job can write, and
# the build jobs (which run the toolchain action) hold a read-only token.
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo build --release --locked
      - name: Stage per-OS artifacts (Linux/macOS binaries share a name)
        shell: bash
        env:
          OS_NAME: ${{ runner.os }}
        run: |
          mkdir dist
          if [ -f target/release/larp.exe ]; then
            cp target/release/larp.exe "dist/larp-${OS_NAME}.exe"
          else
            cp target/release/larp "dist/larp-${OS_NAME}"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: larp-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
      id-token: write # sign build provenance via Sigstore
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS (verified by install.sh / install.ps1)
        working-directory: dist
        run: |
          sha256sum larp-* > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance (verify with `gh attestation verify`)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/larp-*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/larp-*
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
