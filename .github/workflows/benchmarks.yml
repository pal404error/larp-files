name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
  schedule:
    # Weekly on Mondays at 06:00 UTC, to catch slow regressions.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least privilege: the job reads the repo and uploads an artifact
# (artifact upload uses the runtime token, not GITHUB_TOKEN scopes).
permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Run benchmarks (10,000 records)
        run: cargo run --release --example bench | tee bench-results.txt
      - name: Publish results to job summary
        run: |
          {
            echo '```'
            cat bench-results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-results
          path: bench-results.txt
      - name: Check for regressions vs baseline
        run: python3 .github/scripts/check-bench.py bench-results.txt docs/benchmark-baseline.txt
