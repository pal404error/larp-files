<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="280">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d13" />
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0883e" />
      <stop offset="50%" stop-color="#ff9b5e" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#79c0ff" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f242c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.6" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="280" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#f0f6fc" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="280" />
    <line x1="160" y1="0" x2="160" y2="280" />
    <line x1="240" y1="0" x2="240" y2="280" />
    <line x1="320" y1="0" x2="320" y2="280" />
    <line x1="400" y1="0" x2="400" y2="280" />
    <line x1="480" y1="0" x2="480" y2="280" />
    <line x1="560" y1="0" x2="560" y2="280" />
    <line x1="640" y1="0" x2="640" y2="280" />
    <line x1="720" y1="0" x2="720" y2="280" />
    <line x1="800" y1="0" x2="800" y2="280" />
    <line x1="880" y1="0" x2="880" y2="280" />
    <line x1="0" y1="56" x2="960" y2="56" />
    <line x1="0" y1="112" x2="960" y2="112" />
    <line x1="0" y1="168" x2="960" y2="168" />
    <line x1="0" y1="224" x2="960" y2="224" />
  </g>

  <!-- Left: Branding & Value Prop -->
  <g transform="translate(48, 44)">
    <!-- Small Category Pill -->
    <rect x="0" y="0" width="138" height="26" rx="13" fill="#21262d" stroke="#388bfd" stroke-width="1" opacity="0.9" />
    <circle cx="12" cy="13" r="4" fill="#3fb950" />
    <text x="24" y="17" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">AGENT MEMORY</text>

    <!-- Project Title -->
    <text x="0" y="78" fill="url(#brand-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">.larp</text>
    <text x="126" y="76" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">/ larp-memory</text>

    <!-- Tagline -->
    <text x="0" y="112" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">
      Single-file memory format for AI agents
    </text>
    <text x="0" y="136" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Small on disk. Cheap to recall. Zero server. Zero vector DB.
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 162)">
      <!-- Rust tag -->
      <rect x="0" y="0" width="84" height="26" rx="6" fill="#1f242c" stroke="#30363d" stroke-width="1" />
      <text x="42" y="17" fill="#f0883e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle">Rust</text>

      <!-- MCP Server tag -->
      <rect x="94" y="0" width="112" height="26" rx="6" fill="#1f242c" stroke="#30363d" stroke-width="1" />
      <text x="150" y="17" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle">Native MCP</text>

      <!-- Token savings tag -->
      <rect x="216" y="0" width="156" height="26" rx="6" fill="#1f242c" stroke="#238636" stroke-width="1" />
      <text x="294" y="17" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle">99.3% Fewer Tokens</text>
    </g>
  </g>

  <!-- Right: Terminal Box Simulation -->
  <g transform="translate(540, 36)" filter="url(#shadow)">
    <!-- Window Body -->
    <rect width="372" height="208" rx="8" fill="url(#card-grad)" stroke="#30363d" stroke-width="1" />

    <!-- Window Header -->
    <rect width="372" height="32" rx="8" fill="#161b22" />
    <path d="M 0 32 L 372 32" stroke="#30363d" stroke-width="1" />
    <circle cx="16" cy="16" r="4.5" fill="#f85149" />
    <circle cx="30" cy="16" r="4.5" fill="#e3b341" />
    <circle cx="44" cy="16" r="4.5" fill="#3fb950" />
    <text x="186" y="20" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" text-anchor="middle">larp CLI</text>

    <!-- Terminal Code / Command Snippets -->
    <g transform="translate(16, 52)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5">
      <!-- Command 1 -->
      <text x="0" y="14" fill="#8b949e">$</text>
      <text x="14" y="14" fill="#f0883e">larp</text>
      <text x="46" y="14" fill="#f0f6fc">append</text>
      <text x="96" y="14" fill="#79c0ff">--type</text>
      <text x="142" y="14" fill="#a5d6ff">fact "prefers rust"</text>
      
      <!-- Output 1 -->
      <text x="0" y="32" fill="#3fb950">appended #1 (CRC ok, zstd v2)</text>

      <!-- Command 2 -->
      <text x="0" y="58" fill="#8b949e">$</text>
      <text x="14" y="58" fill="#f0883e">larp</text>
      <text x="46" y="58" fill="#f0f6fc">recall</text>
      <text x="96" y="58" fill="#79c0ff">--max-tokens</text>
      <text x="184" y="58" fill="#f0f6fc">2000 rust</text>

      <!-- Output 2 -->
      <text x="0" y="78" fill="#58a6ff">#1 score=0.900 [fact] prefers rust</text>
      <text x="0" y="96" fill="#8b949e">───────────────────────────────────</text>
      <text x="0" y="114" fill="#3fb950">tokens used: 7 / 2000</text>
      <text x="160" y="114" fill="#8b949e">(0.70ms)</text>
      
      <!-- Live Indicator -->
      <circle cx="6" cy="132" r="3" fill="#3fb950" />
      <text x="16" y="135" fill="#8b949e" font-size="10.5">MCP ready on stdio</text>
    </g>
  </g>
</svg>
