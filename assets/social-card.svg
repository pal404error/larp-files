<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="sc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d13" />
      <stop offset="60%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="sc-brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0883e" />
      <stop offset="40%" stop-color="#ff9b5e" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
    <linearGradient id="sc-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#79c0ff" />
    </linearGradient>
    <filter id="sc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="640" fill="url(#sc-bg)" />

  <!-- Ambient Glow Elements -->
  <circle cx="200" cy="180" r="160" fill="#f0883e" opacity="0.12" filter="url(#sc-glow)" />
  <circle cx="1080" cy="460" r="180" fill="#238636" opacity="0.10" filter="url(#sc-glow)" />
  <circle cx="640" cy="100" r="140" fill="#58a6ff" opacity="0.08" filter="url(#sc-glow)" />

  <!-- Grid Lines -->
  <g opacity="0.06" stroke="#f0f6fc" stroke-width="1">
    <line x1="0" y1="128" x2="1280" y2="128" />
    <line x1="0" y1="256" x2="1280" y2="256" />
    <line x1="0" y1="384" x2="1280" y2="384" />
    <line x1="0" y1="512" x2="1280" y2="512" />
    <line x1="256" y1="0" x2="256" y2="640" />
    <line x1="512" y1="0" x2="512" y2="640" />
    <line x1="768" y1="0" x2="768" y2="640" />
    <line x1="1024" y1="0" x2="1024" y2="640" />
  </g>

  <!-- Outer Border -->
  <rect x="20" y="20" width="1240" height="600" rx="20" fill="none" stroke="#30363d" stroke-width="1.5" />

  <!-- Top Metadata Bar -->
  <g transform="translate(80, 75)">
    <rect x="0" y="0" width="180" height="34" rx="17" fill="#1f242c" stroke="#388bfd" stroke-width="1.2" />
    <circle cx="16" cy="17" r="5" fill="#3fb950" />
    <text x="32" y="22" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">AGENT INFRASTRUCTURE</text>
    
    <text x="210" y="22" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">pal404error / larp-files</text>
  </g>

  <!-- Big Title -->
  <g transform="translate(80, 210)">
    <text x="0" y="0" fill="url(#sc-brand)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="88" font-weight="900" letter-spacing="-3">.larp</text>
    
    <!-- Headline -->
    <text x="0" y="65" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="700">
      Agent memory in a single file
    </text>
    <text x="0" y="110" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
      Small on disk. Cheap to recall. Fast, crash-safe, and zero servers.
    </text>
  </g>

  <!-- Three Value Metric Cards -->
  <g transform="translate(80, 390)">
    <!-- Card 1: Token Savings -->
    <g transform="translate(0, 0)">
      <rect width="350" height="150" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <rect width="350" height="150" rx="14" fill="none" stroke="#238636" stroke-width="1" opacity="0.4" />
      <text x="24" y="44" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800">99.3%</text>
      <text x="24" y="80" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">Fewer Tokens Recalled</text>
      <text x="24" y="112" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
        1,991 tokens used vs ~287k for full file
      </text>
    </g>

    <!-- Card 2: Speed / Latency -->
    <g transform="translate(385, 0)">
      <rect width="350" height="150" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <text x="24" y="44" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800">0.70 ms</text>
      <text x="24" y="80" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">Sub-Millisecond Recall</text>
      <text x="24" y="112" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
        Keyword × Salience × Recency decay
      </text>
    </g>

    <!-- Card 3: Integrations -->
    <g transform="translate(770, 0)">
      <rect width="350" height="150" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <text x="24" y="44" fill="#f0883e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800">Native MCP</text>
      <text x="24" y="80" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">Model Context Protocol</text>
      <text x="24" y="112" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
        Claude Code • Cursor • VS Code • Codex
      </text>
    </g>
  </g>

  <!-- Bottom Right Brand Seal -->
  <g transform="translate(1120, 565)">
    <text x="0" y="0" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" text-anchor="end">MIT License • Rust 2021</text>
  </g>
</svg>
